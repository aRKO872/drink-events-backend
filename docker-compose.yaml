services:
  db:
    container_name: postgres
    image: postgres
    env_file:
      - .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5332:5432"
    restart: unless-stopped

  pgadmin:
    restart: always
    image: dpage/pgadmin4
    container_name: pgadmin
    env_file:
      - .env
    depends_on:
      - db
    volumes: 
      - pgadmin_data:/var/lib/pgadmin/
    ports:
      - "4000:80"

  redis:
    image: redis:latest
    container_name: redis
    env_file:
      - .env
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    container_name: backend
    volumes:
      - ./:/app/
    ports:
      - "3050:3050"
    depends_on:
      - db
      - redis
  
  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgadmin_data:
    driver: local
  pg_data:
    driver: local
  redis_data:
    driver: local